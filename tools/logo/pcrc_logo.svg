<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Sfondo Nero Stealth -->
    <radialGradient id="bgShark" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Gradiente Pannello Frontale (Grigio Scuro Antracite -> Nero) -->
    <linearGradient id="frontSolid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262626" />
      <stop offset="100%" stop-color="#121212" />
    </linearGradient>

    <!-- Gradiente Sezione Mesh Inferiore Frontale -->
    <linearGradient id="frontMesh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#080808" />
    </linearGradient>

    <!-- Pattern minimale a micro-punti per suggerire la griglia mesh inferiore -->
    <pattern id="meshDots" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(25)">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" opacity="0.16" />
    </pattern>

    <!-- Gradiente Vetro Laterale -->
    <linearGradient id="sideGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A" />
      <stop offset="100%" stop-color="#070707" />
    </linearGradient>

    <!-- Riflesso obliquo sul vetro (come nella foto) -->
    <linearGradient id="glassGlare" x1="0%" y1="0%" x2="100%" y2="20%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Bagliore Bianco Morbido (Soft White Glow) -->
    <filter id="whiteGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Bagliore soffuso di contorno per staccare la sagoma nera -->
    <filter id="caseRimGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="10" flood-color="#FFFFFF" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- 1. SFONDO ICONA ANDROID -->
  <rect width="512" height="512" rx="115" fill="url(#bgShark)" />

  <!-- 2. ONDE CONTROLLO REMOTO SUPERIORI (Emesse dalla sommità del case) -->
  <g filter="url(#whiteGlow)" fill="none" stroke="#FFFFFF" stroke-linecap="round">
    <path d="M 235 66 A 65 65 0 0 1 325 78" stroke-width="7" />
    <path d="M 218 38 A 98 98 0 0 1 352 56" stroke-width="6" opacity="0.55" />
  </g>

  <!-- 3. PIEDINI DEL CASE (Fedele alla base della foto) -->
  <g fill="#0A0A0A" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" opacity="0.85">
    <!-- Piedino posteriore sinistro -->
    <polygon points="108,366 108,384 134,394 148,386 148,378" />
    <!-- Piedino anteriore centrale -->
    <polygon points="236,426 236,448 268,462 292,450 292,438" />
    <!-- Piedino anteriore destro -->
    <polygon points="376,412 376,424 404,412 404,398" />
  </g>

  <!-- 4. CORPO DEL CASE (Prospettiva a 2 punti fedele alla foto Sharkoon) -->
  <g filter="url(#caseRimGlow)">

    <!-- A. FIANCO SINISTRO SUPERIORE: Vetro Temperato -->
    <polygon points="96,148 266,92 266,368 96,318" fill="url(#sideGlass)" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round" />

    <!-- Riflesso diagonale netto sul vetro (angolo in alto a sinistra come in foto) -->
    <polygon points="98,150 162,128 134,328 98,316" fill="url(#glassGlare)" />

    <!-- Accenno ultra-minimale interno (Solo l'anello tenue della ventola/AIO e linea GPU) -->
    <ellipse cx="152" cy="204" rx="24" ry="30" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.18" />
    <line x1="126" y1="254" x2="236" y2="276" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.25" />

    <!-- Viti laterali del vetro temperato (2 a sinistra) -->
    <circle cx="96" cy="166" r="4" fill="#FFFFFF" />
    <circle cx="96" cy="302" r="4" fill="#FFFFFF" />

    <!-- B. FIANCO SINISTRO INFERIORE: Fascia Metallica (PSU Shroud) -->
    <polygon points="96,318 266,368 266,438 96,362" fill="#141414" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round" />

    <!-- C. PANNELLO FRONTALE: Superficie Liscia Superiore -->
    <polygon points="266,92 426,124 426,396 266,442" fill="url(#frontSolid)" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" />

    <!-- D. PANNELLO FRONTALE: Sezione Mesh Triangolare Inferiore (con texture a micro-punti) -->
    <polygon points="426,214 282,368 282,424 426,382" fill="url(#frontMesh)" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.4" stroke-linejoin="round" />
    <polygon points="426,214 282,368 282,424 426,382" fill="url(#meshDots)" />
    <!-- Piccola griglia laterale sul bordino sinistro del frontale -->
    <polygon points="266,368 282,368 282,424 266,422" fill="url(#meshDots)" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.3" />
  </g>

  <!-- 5. TAGLIO LED CARATTERISTICO SHARKOON (Verticale in alto a destra -> Diagonale verso il basso a sinistra) -->
  <polyline points="406,128 406,218 284,352" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#whiteGlow)" />

  <!-- Spigolo centrale luminoso per dare stacco 3D tra vetro e frontale -->
  <line x1="266" y1="92" x2="266" y2="442" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.9" />

  <!-- 6. ACCENNO ICONA REMOTE CONTROL SUL FRONTALE (Minimalista e in prospettiva) -->
  <g transform="translate(334, 212) skewY(11) scale(0.92, 1)" filter="url(#whiteGlow)" fill="none" stroke="#FFFFFF" stroke-linecap="round">
    <!-- Archi di segnale wireless rivolti verso l'alto (stile telecomando) -->
    <path d="M -16 -24 A 24 24 0 0 1 16 -24" stroke-width="3.5" opacity="0.85" />
    <path d="M -25 -35 A 36 36 0 0 1 25 -35" stroke-width="3" opacity="0.45" />

    <!-- Simbolo Power Remote minimale sottostante -->
    <path d="M -9 -5 A 13 13 0 1 0 9 -5" stroke-width="3.5" opacity="0.9" />
    <line x1="0" y1="-12" x2="0" y2="0" stroke-width="3.5" />
  </g>

  <!-- Dettaglio superiore minimalista (Al posto del logo Sharkoon) -->
  <g transform="translate(302, 126) skewY(11)" opacity="0.7">
    <line x1="-10" y1="0" x2="10" y2="0" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>